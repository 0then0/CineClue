name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16.15-alpine", "17.11-alpine", "18.6-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: cineclue
          POSTGRES_PASSWORD: cineclue
          POSTGRES_DB: cineclue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cineclue -d cineclue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cineclue:cineclue@localhost:5432/cineclue_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:seed
      - run: pnpm test:integration
      - if: matrix.postgres == '18.6-alpine'
        run: docker compose build app
